name: Refresh dam schedules
on:
  schedule:
    - cron: "17 * * * *"   # hourly; the Corps posts new days at irregular times
  workflow_dispatch:
permissions: {}
jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - run: python3 -I scripts/scrape_schedule.py
      - run: python3 -I scripts/scrape_morganfalls.py
        continue-on-error: true
      - name: Commit if changed
        run: |
          git config user.name "schedule-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/schedule.json data/morganfalls.json
          git diff --cached --quiet || (git commit -m "Update Buford schedule" && git push)
